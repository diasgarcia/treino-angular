<section class="app d-flex column gap-1">
    @for (pessoa of pessoas; track pessoa.nome) {
        <app-card [nome]="pessoa.nome"
                  [idade]="pessoa.idade"
                  [ehInstrutor]="pessoa.ehInstrutor ?? false"
                  [nota]="pessoa.nota"
                  [cpf]="pessoa.cpf"
                  [corFavorita]="pessoa.corFavorita">
        </app-card>
    }
</section>
